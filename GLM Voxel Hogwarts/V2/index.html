  camPer = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 8000);
  composer = new EffectComposer(renderer);
  rPass = new RenderPass(scene, camIso);
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.35, 0.85);
  composer.addPass(rPass);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  buildClouds();
  buildMoon();
  buildFlyingCar();
}

/* ── clouds ── */
const CLOUDM = new THREE.MeshLambertMaterial({
  color: 0x7783ab, transparent: true, opacity: 0.62, emissive: 0x10162e, depthWrite: false });

function makeCloudCell() {
  const cells = new Set();
  const lumps = [];
  const nE = 3 + Math.floor(rnd() * 5);
  for (let e = 0; e < nE; e++)
    lumps.push({
      x: (rnd() * 2 - 1) * 12, y: (rnd() * 2 - 1) * 3, z: (rnd() * 2 - 1) * 12,
      rx: 5 + rnd() * 8, ry: 3 + rnd() * 3.5, rz: 5 + rnd() * 8
    });
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, zz0 = 1e9, zz1 = -1e9;
  for (const L of lumps) {
    x0 = Math.min(x0, L.x - L.rx); x1 = Math.max(x1, L.x + L.rx);
    y0 = Math.min(y0, L.y - L.ry); y1 = Math.max(y1, L.y + L.ry);
    zz0 = Math.min(zz0, L.z - L.rz); zz1 = Math.max(zz1, L.z + L.rz);
  }
  for (let z = Math.floor(zz0 / 2); z <= Math.ceil(zz1 / 2); z++)
    for (let y = Math.floor(y0 / 2); y <= Math.ceil(y1 / 2); y++)
      for (let x = Math.floor(x0 / 2); x <= Math.ceil(x1 / 2); x++) {
        const px = x * 2, py = y * 2, pz = z * 2;
        for (const L of lumps) {
          const dx = (px - L.x) / L.rx, dy = (py - L.y) / L.ry, dz = (pz - L.z) / L.rz;
          if (dx * dx + dy * dy + dz * dz <= 1) { cells.add(x + ',' + y + ',' + z); break; }
        }
      }
  return cells;
}

function buildClouds() {
  cloudGroup = new THREE.Group();
  cloudGroup.position.set(CX, 0, CZ);                     /* pivot = island centre */
  for (let i = 0; i < 26; i++) {
    const ang = rnd() * Math.PI * 2, rr = (R - 12) + rnd() * 40;
    const cx = CX + Math.cos(ang) * rr, cz = CZ + Math.sin(ang) * rr;
    const yy = LAKE_Y - 52 + rnd() * 40;
    const g = new THREE.Mesh(meshCells(makeCloudCell(), 2, [1, 1, 1]), CLOUDM);
    g.position.set(cx - CX, yy, cz - CZ);
    cloudGroup.add(g);
    cloudUnits.push({ mesh: g, baseY: yy, ph: rnd() * 6.28, sp: 0.35 + rnd() * 0.5 });
  }
  for (let i = 0; i < 4; i++) {
    const ang = rnd() * Math.PI * 2, rr = 175 + rnd() * 105;
    const cx = CX + Math.cos(ang) * rr, cz = CZ + Math.sin(ang) * rr, yy = 130 + rnd() * 42;
    const g = new THREE.Mesh(meshCells(makeCloudCell(), 2, [1, 1, 1]), CLOUDM);
    g.position.set(cx - CX, yy, cz - CZ);
    cloudGroup.add(g);
    cloudUnits.push({ mesh: g, baseY: yy, ph: rnd() * 6.28, sp: 0.35 + rnd() * 0.5 });
  }
  scene.add(cloudGroup);
}

/* ── the voxel moon ── */
function buildMoon() {
  const cells = new Set(), R2 = 6.35 * 6.35;
  for (let z = -7; z <= 7; z++) for (let y = -7; y <= 7; y++)
    for (let x = -7; x <= 7; x++) {
      const d2 = x * x + y * y + z * z;
      if (d2 <= R2 && hash(x, y, z, 311) > 0.06) cells.add(x + ',' + y + ',' + z);
    }
  moonMesh = new THREE.Mesh(meshCells(cells, 3, [1.28, 1.22, 1.08]),
    new THREE.MeshBasicMaterial({ vertexColors: true, fog: false }));
  moonMesh.renderOrder = -1;
  moonMesh.frustumCulled = false;
  scene.add(moonMesh);
}

/* re-project the moon into the sky every frame */
function updateMoon() {
  const dx = Math.sin(view.yaw) * Math.cos(view.pitch);
  const dy = Math.sin(view.pitch);
  const dz = Math.cos(view.yaw) * Math.cos(view.pitch);
  const fx = -dx, fyv = -dy, fz = -dz;                    /* camera forward   */
  let rx = -fz, ry = 0, rz = fx;                          /* right = fwd × up */
  const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
  const ux = ry * fz - rz * fyv, uy = rz * fx - rx * fz, uz2 = rx * fyv - ry * fx;
  /* up = right × fwd */
  const lx = MOON_SKY.x * rx + MOON_SKY.y * 0 + MOON_SKY.z * rz;
  const ly = MOON_SKY.x * ux + MOON_SKY.y * uy + MOON_SKY.z * uz2;
  const lz = -(MOON_SKY.x * dx + MOON_SKY.y * dy + MOON_SKY.z * dz);
  if (lz <= 0.05) { moonMesh.visible = false; return; }
  moonMesh.visible = true;
  const iso = view.ortho;
  const tanV = iso ? 1.42815 : Math.tan(22.5 * DR);
  const aspect = innerWidth / innerHeight;
  const halfH = view.dist * (iso ? 0.42 : tanV);
  const ndcX = (lx / lz) / (tanV * aspect);
  const ndcY = (ly / lz) / tanV;
  const px = view.tx - dx * 1400 + ux * ndcY * halfH + rx * ndcX * halfH * aspect;
  const py = view.ty - dy * 1400 + uy * ndcY * halfH + 0 * ndcX * halfH * aspect;
  const pz = view.tz - dz * 1400 + uz2 * ndcY * halfH + rz * ndcX * halfH * aspect;
  moonMesh.position.set(px, py, pz);
  moonMesh.scale.setScalar(Math.max(0.35, halfH / 300));
}

/* ── the flying Ford Anglia ── */
function buildFlyingCar() {
  const parts = [
    { x: 0, y: -1.7, z: 0, sx: 4, sy: 1.3, sz: 8.2, hex: '#6d9cc2' },      // chassis
    { x: 0, y: -0.75, z: 3.0, sx: 3.7, sy: 0.7, sz: 2.6, hex: '#6d9cc2' }, // bonnet
    { x: 0, y: -0.75, z: -2.7, sx: 3.7, sy: 0.7, sz: 3.2, hex: '#6d9cc2' },// boot
    { x: 0, y: -2.0, z: 4.35, sx: 3.3, sy: 0.8, sz: 0.9, hex: '#b8bec6' }, // chrome F
    { x: 0, y: -2.0, z: -4.35, sx: 3.3, sy: 0.8, sz: 0.9, hex: '#b8bec6' },// chrome R
    { x: 0, y: 0.15, z: 0.55, sx: 3.4, sy: 1.45, sz: 4.7, hex: '#2c3a5a' },// window band
    { x: -1.75, y: 0.15, z: 2.35, sx: 0.7, sy: 1.45, sz: 0.7, hex: '#6d9cc2' },
    { x: 1.75,  y: 0.15, z: 2.35, sx: 0.7, sy: 1.45, sz: 0.7, hex: '#6d9cc2' },
    { x: -1.75, y: 0.15, z: -1.35, sx: 0.7, sy: 1.45, sz: 0.7, hex: '#6d9cc2' },
    { x: 1.75,  y: 0.15, z: -1.35, sx: 0.7, sy: 1.45, sz: 0.7, hex: '#6d9cc2' },
    { x: 0, y: 1.05, z: 0.55, sx: 4.1, sy: 0.55, sz: 5.7, hex: '#6d9cc2' }, // blue roof
    { x: -1.95, y: -2.55, z: 2.6, sx: 1.15, sy: 2.3, sz: 2.3, hex: '#141419' },
    { x: 1.95,  y: -2.55, z: 2.6, sx: 1.15, sy: 2.3, sz: 2.3, hex: '#141419' },
    { x: -1.95, y: -2.55, z: -2.6, sx: 1.15, sy: 2.3, sz: 2.3, hex: '#141419' },
    { x: 1.95,  y: -2.55, z: -2.6, sx: 1.15, sy: 2.3, sz: 2.3, hex: '#141419' },
    { x: -1.2, y: -1.45, z: 4.5, sx: 0.95, sy: 0.75, sz: 0.45, hex: '#fff3d8', glow: true, lum: 2.4 },
    { x: 1.2,  y: -1.45, z: 4.5, sx: 0.95, sy: 0.75, sz: 0.45, hex: '#fff3d8', glow: true, lum: 2.2 },
    { x: -1.35, y: -1.45, z: -4.5, sx: 0.9, sy: 0.6, sz: 0.4, hex: '#ff4038', glow: true, lum: 1.5 },
    { x: 1.35,  y: -1.45, z: -4.5, sx: 0.9, sy: 0.6, sz: 0.4, hex: '#ff4038', glow: true, lum: 1.5 }
  ];
  const g = miniMesh(parts);
  carGroup = new THREE.Group();
  const mS = new THREE.Mesh(g.solid, MATS.solid); mS.castShadow = true;
  const mG = new THREE.Mesh(g.glow, MATS.emis);
  carGroup.add(mS, mG);
  carGroup.scale.setScalar(1.3);
  carLight = new THREE.PointLight(0xffe2b0, 45, 45, 1.6);
  carLight.position.set(0, -0.8, 9);
  carGroup.add(carLight);
  scene.add(carGroup);
}

let carTheta = 0;
function updateFlyingCar(t, dt) {
  carTheta += 0.1 * dt;
  const th = carTheta;
  const px = 148 + 98 * Math.cos(th);
  const py = PLAT_Y + 50 + 10 * Math.sin(2 * th) + 3 * Math.sin(3 * th);
  const pz = 145 + 95 * Math.sin(th);
  const bob = 1.2 * Math.sin(2.4 * t) + 0.3 * Math.sin(5.3 * t);
  carGroup.position.set(px, py + bob, pz);
  const th2 = th + 0.09;
  carGroup.lookAt(148 + 98 * Math.cos(th2),
                  PLAT_Y + 50 + 10 * Math.sin(2 * th2) + 3 * Math.sin(3 * th2),
                  145 + 95 * Math.sin(th2));
  carGroup.rotateZ(0.16 + 0.1 * Math.sin(1.7 * t));
  carGroup.rotateX(0.07 * Math.sin(2.4 * t + 1));
}

/* lantern flicker */
function buildPointLights() {
  for (const p of POINTS) {
    const L = new THREE.PointLight(0xffa24d, 38 * p.s, 44, 1.3);
    L.position.set(p.x, p.y, p.z);
    scene.add(L);
    flickers.push({ L, s: p.s, ph: rnd() * 40 });
  }
}
function updateLights(t) {
  for (const f of flickers)
    f.L.intensity = 38 * f.s * (0.84 + 0.16 * vnoise(t * 5 + f.ph, f.ph * 2, 999));
}

function updateClouds(t, dt) {
  cloudGroup.rotation.y += dt * 0.0035;
  for (const c of cloudUnits) {
    c.mesh.position.y = c.baseY + Math.sin(t * c.sp + c.ph) * 1.6;
  }
}

/* warm point-light list is built after chunk meshes */
function addPointLights() { buildPointLights(); }
/* ════════════════════════════════════════════════════════════════════
   08_main.js — camera controls, build pipeline, render loop
   ════════════════════════════════════════════════════════════════════ */

const view = {
  tx: CX + 4, ty: PLAT_Y - 4, tz: CZ + 4,
  yaw: 0.62, pitch: 0.6155, dist: 330, distGoal: 330,
  ortho: true
};
const RESET = { yaw: 0.62, pitch: 0.6155, dist: 330, distGoal: 330, tx: CX + 4, ty: PLAT_Y - 4, tz: CZ + 4 };
let autoOrbit = false, trisTotal = 0, fps = 60;

const keys = {};
const canvasEl = () => renderer.domElement;

function viewDir() {
  const cp = Math.cos(view.pitch);
  return [Math.sin(view.yaw) * cp, Math.sin(view.pitch), Math.cos(view.yaw) * cp];
}

function updateCamera() {
  const [dx, dy, dz] = viewDir();
  const aspect = innerWidth / innerHeight;
  if (view.ortho) {
    const halfH = view.dist * 0.42, halfW = halfH * aspect;
    camIso.left = -halfW; camIso.right = halfW;
    camIso.top = halfH; camIso.bottom = -halfH;
    camIso.position.set(view.tx + dx * 1500, view.ty + dy * 1500, view.tz + dz * 1500);
    camIso.up.set(0, 1, 0);
    camIso.lookAt(view.tx, view.ty, view.tz);
    camIso.updateProjectionMatrix();
    rPass.camera = camIso;
  } else {
    camPer.aspect = aspect;
    camPer.position.set(view.tx + dx * view.dist, view.ty + dy * view.dist, view.tz + dz * view.dist);
    camPer.lookAt(view.tx, view.ty, view.tz);
    camPer.updateProjectionMatrix();
    rPass.camera = camPer;
  }
}

/* ── input ── */
function applyKeys(dt) {
  const K = (...cs) => cs.some(c => keys[c]);
  const shift = K('ShiftLeft', 'ShiftRight');
  const spd = Math.max(12, view.dist * 0.75) * (shift ? 3 : 1) * dt;
  const [dx, dy, dz] = viewDir();
  const fwd = view.ortho ? [-Math.sin(view.yaw), 0, -Math.cos(view.yaw)] : [-dx, -dy, -dz];
  const rx = Math.cos(view.yaw), rz = -Math.sin(view.yaw);
  if (K('KeyW')) { view.tx += fwd[0] * spd; view.ty += fwd[1] * spd; view.tz += fwd[2] * spd; }
  if (K('KeyS')) { view.tx -= fwd[0] * spd; view.ty -= fwd[1] * spd; view.tz -= fwd[2] * spd; }
  if (K('KeyA')) { view.tx -= rx * spd; view.tz -= rz * spd; }
  if (K('KeyD')) { view.tx += rx * spd; view.tz += rz * spd; }
  if (K('KeyR', 'Space')) view.ty += spd;
  if (K('KeyF', 'KeyC')) view.ty -= spd;
  if (K('KeyQ')) view.yaw += 0.9 * dt;
  if (K('KeyE')) view.yaw -= 0.9 * dt;
  if (K('ArrowLeft')) view.yaw += 0.9 * dt;
  if (K('ArrowRight')) view.yaw -= 0.9 * dt;
  if (K('ArrowUp')) view.pitch = clamp(view.pitch + 0.55 * dt, 0.03, 1.5);
  if (K('ArrowDown')) view.pitch = clamp(view.pitch - 0.55 * dt, 0.03, 1.5);
  const zf = K('Equal', 'NumpadAdd', 'PageUp', 'KeyZ') ? 1 : 0,
        zo = K('Minus', 'NumpadSubtract', 'PageDown', 'KeyX') ? 1 : 0;
  if (zf) view.distGoal = clamp(view.distGoal * Math.exp(1.1 * dt), 6, 900);
  if (zo) view.distGoal = clamp(view.distGoal / Math.exp(1.1 * dt), 6, 900);
  view.tx = clamp(view.tx, -400, W + 400);
  view.tz = clamp(view.tz, -400, D + 400);
  view.ty = clamp(view.ty, -200, 700);
}

function bindInput() {
  const el = canvasEl();
  addEventListener('keydown', e => {
    if (e.code === 'KeyP') { view.ortho = !view.ortho; updateStats(); }
    else if (e.code === 'KeyT') autoOrbit = !autoOrbit;
    else if (e.code === 'KeyH') document.getElementById('help').classList.toggle('packed');
    else if (e.code === 'Digit0' || e.code === 'Home') { Object.assign(view, RESET); setMode(true); }
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown'].includes(e.code))
      e.preventDefault();
    keys[e.code] = true;
  });
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  el.addEventListener('wheel', e => {
    e.preventDefault();
    view.distGoal = clamp(view.distGoal * Math.pow(1.0016, e.deltaY), 6, 900);
  }, { passive: false });

  const pts = new Map();
  let panMode = false, last = null;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    panMode = e.button !== 0 || e.shiftKey;
    if (pts.size === 2) panMode = true;
    last = { x: e.clientX, y: e.clientY };
    el.style.cursor = 'grabbing';
  });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size >= 2) {                                  /* pinch zoom + pan */
      const ids = [...pts.keys()], a = pts.get(ids[0]), b = pts.get(ids[1]);
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD) view.distGoal = clamp(view.distGoal * pinchD / d, 6, 900);
      pinchD = d;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      if (lastP) pan(mx - lastP.x, my - lastP.y);
      lastP = { x: mx, y: my };
      return;
    }
    const dx2 = e.clientX - last.x, dy2 = e.clientY - last.y;
    last = { x: e.clientX, y: e.clientY };
    if (panMode) pan(dx2, dy2);
    else {
      view.yaw -= dx2 * 0.0052;
      view.pitch = clamp(view.pitch + dy2 * 0.0045, 0.03, 1.5);
    }
  });
  let pinchD = 0, lastP = null;
  const end = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) { pinchD = 0; lastP = null; }
    if (pts.size === 0) { el.style.cursor = 'grab'; panMode = false; }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.style.cursor = 'grab';

  function pan(dx2, dy2) {
    const s = view.dist * 0.0016;
    const [dx3, dy3, dz3] = viewDir();
    const fx = -dx3, fyv = -dy3, fz = -dz3;
    let rx2 = -fz, rz2 = fx; const rl = Math.hypot(rx2, rz2) || 1; rx2 /= rl; rz2 /= rl;
    const ux2 = -rz2 * fyv, uy2 = rz2 * fx - rx2 * fz, uz2 = rx2 * fyv;
    view.tx += (ux2 * dy2 - rx2 * dx2) * s;
    view.ty += uy2 * dy2 * s;
    view.tz += (uz2 * dy2 - rz2 * dx2) * s;
  }
}

/* ── loader helpers ── */
function setProgress(frac, msg) {
  document.getElementById('fill').style.width = Math.round(frac * 100) + '%';
  if (msg) document.getElementById('lstep').textContent = msg;
}
const tickIO = () => new Promise(r => {          /* unthrottled by background tabs */
  const ch = new MessageChannel();
  ch.port1.onmessage = () => { ch.port1.close(); r(); };
  ch.port2.postMessage(0);
});

/* ── stats & debug hooks ── */
function updateStats() {
  document.getElementById('stats').textContent =
    `${fps | 0} fps · ${(trisTotal / 1000 | 0)}k tris · ${view.ortho ? 'isometric' : 'perspective'}`;
}

window.__cam = o => {
  if (o) {
    if ('az' in o) view.yaw = +o.az;
    if ('el' in o) view.pitch = +o.el;
    if ('dist' in o) { view.dist = +o.dist; view.distGoal = +o.dist; }
    if ('tx' in o) view.tx = +o.tx;
    if ('ty' in o) view.ty = +o.ty;
    if ('tz' in o) view.tz = +o.tz;
    if ('ortho' in o) view.ortho = !!o.ortho;
    updateCamera();
  }
  return { az: view.yaw, el: view.pitch, dist: view.dist,
           tx: view.tx, ty: view.ty, tz: view.tz, ortho: view.ortho };
};
window.__stats = {};
window.hogwarts = { get view() { return view; }, scene: () => scene, get, PAL };

/* ── build pipeline ── */
function setMode(orthoMode) { view.ortho = orthoMode; }

async function main() {
  const fail = e => {
    console.error(e);
    const box = document.getElementById('lerr');
    box.style.display = 'block';
    box.textContent = 'Error: ' + (e && (e.stack || e.message || e));
  };
  self.addEventListener('error', e => fail(e.error || e.message));
  self.addEventListener('unhandledrejection', e => fail(e.reason));

  try {
    sceneInit();
    await tickIO();

    setProgress(0.05, 'raising the island…');
    buildTerrain();
    await tickIO();

    setProgress(0.14, 'laying the castle walls…');
    buildCastle();
    await tickIO();

    setProgress(0.3, 'growing the grounds…');
    buildGrounds();
    await tickIO();

    setProgress(0.36, 'carving 200,000 faces…');
    const nCh = NXC * NYCH * NZC; let done = 0;
    trisTotal = await buildChunkMeshes(scene, () => {
      done++;
      setProgress(0.36 + 0.5 * done / nCh, `carving faces… ${(done / nCh * 100 | 0)}%`);
    }, tickIO);
    if (facesDropped) console.warn('mesh overflow: ' + facesDropped + ' faces dropped');

    setProgress(0.9, 'hanging the clouds…');
    buildPointLights();
    await tickIO();

    setProgress(1, 'waking the night…');
    updateCamera();
    updateMoon();
    await tickIO();

    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloomPass.setSize(innerWidth, innerHeight);
    });

    bindInput();
    let last = performance.now(), tAcc = 0, statT = 0;
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      tAcc += dt;
      fps = fps * 0.94 + (1 / Math.max(dt, 1e-4)) * 0.06;
      applyKeys(dt);
      if (autoOrbit) view.yaw += 0.22 * dt;
      view.dist += (view.distGoal - view.dist) * Math.min(1, dt * 7);
      updateCamera();
      updateClouds(tAcc, dt);
      updateFlyingCar(tAcc, dt);
      updateMoon();
      updateLights(tAcc);
      composer.render();
      statT += dt;
      if (statT > 0.5) {
        statT = 0;
        updateStats();
        Object.assign(window.__stats, { fps, tris: trisTotal, mode: view.ortho ? 'iso' : 'persp',
                                        dist: view.dist, dropped: facesDropped,
                                        drawn: renderer.info.render.triangles,
                                        calls: renderer.info.render.calls });
      }
    }
    requestAnimationFrame(loop);

    const ld = document.getElementById('loader');
    ld.style.opacity = '0';
    setTimeout(() => ld.style.display = 'none', 900);
    setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 7000);
  } catch (e) { fail(e); }
}

main();
</script>
